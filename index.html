<style>
:root{color-scheme:dark;--bg:#050505;--card:#131413;--ln:#2b2e2a;--tx:#fff;--mu:#a9aea6;--ac:#c3f645;--on:#0a0d02;--bad:#ff7a59;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Barlow,system-ui,sans-serif;padding-bottom:84px}
h1,h2,h3,.big{margin:0 0 .4em;line-height:1.1}h1{font-size:1.8rem}h2{font-size:1.35rem}h3{font-size:1.05rem}
.big{font-size:2rem;color:var(--ac);font-weight:700}main{max-width:900px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:14px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.grid .card{margin:0}
.mu{color:var(--mu);font-size:.9rem}label{display:block;margin:0 0 12px;font-size:.9rem;color:var(--mu)}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:10px;font:inherit;margin-top:4px}
button{background:var(--ac);color:var(--on);border:0;border-radius:8px;padding:11px 16px;font:600 1rem Barlow,sans-serif;cursor:pointer;margin:0 6px 6px 0}button.g{background:none;color:var(--tx);border:1px solid var(--ln)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1 0 auto;background:none;color:var(--mu);margin:0;padding:10px 12px}nav button.on{color:var(--ac);border-bottom:2px solid var(--ac);border-radius:0}
.warn{border-color:var(--bad);color:var(--bad)}.bar{height:6px;background:var(--ln);border-radius:3px}.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}.wk div{border:1px solid var(--ln);border-radius:6px;padding:4px;font-size:.72rem;min-height:52px;cursor:pointer;overflow:hidden}
.wk .q{border-color:var(--ac)}.wk .t{background:var(--ac);color:var(--on)}.wk .s{outline:2px solid var(--tx)}.wk .d{opacity:.55}
svg text{fill:var(--mu);font-size:10px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}details{border-bottom:1px solid var(--ln);padding:8px 0}summary{cursor:pointer;font-weight:500}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--ln);font-size:.9rem}
h1,h2,h3,.big,button{font-family:Saira,"Arial Black",system-ui,sans-serif;font-style:italic;font-stretch:125%}h1,h2,h3,.big{font-weight:800}button{font-weight:700;font-stretch:115%;letter-spacing:.02em}nav button{font-size:.8rem}.brand{display:flex;align-items:center;gap:10px;margin:0 0 14px}.brand img{width:44px;height:44px;border-radius:6px}.wm{font:italic 800 1.6rem/1 Saira,sans-serif;font-stretch:125%;color:var(--tx);display:block}.hero{display:block;width:min(260px,70%);margin:0 auto 8px}
</style></head><body><main id="app"></main><nav id="nav"></nav>

const SCI="1) About 80% of running should be easy and conversational; hard sessions are limited and spaced at least 48 hours apart unless a coach sets otherwise. 2) Raise load gradually: a 5–10% weekly distance rise is a rule of thumb, not a safety guarantee; keep every fourth week lighter and never raise volume, intensity and complexity together. 3) Young athletes: growth, school load and sleep affect recovery; prioritise enjoyment, variety and patience over volume. 4) Easy = talk test; threshold = comfortably hard, roughly one-hour race effort; intervals use event-specific pace with equal reps; strides are 15–20 s relaxed for form. 5) Events: 800–1500 m need speed plus aerobic base; 3–5 km need aerobic power and threshold; 10 km to half marathon need threshold and durable endurance; cross-country needs strength, hills and effort-based pacing. 6) Taper: cut volume roughly 30–50% over 7–10 days, keep a little race-pace work, add nothing new. 7) Pacing: even or slightly negative splits from 3 km up; a controlled start beats a fast one. 8) Missed training: never make it up; resume the plan; a short gap barely changes fitness. 9) Plateaus: look at consistency, easy days run too fast, fatigue, lack of race data and untested goals. 10) Be humble: finish times cannot show physiological limits; pace and heart rate shift with heat, hills and sleep; training-load ratios are debated; say when advice is a rule of thumb. 11) Out of scope: nutrition, hydration, supplements, diagnosing injuries, medical advice.";

function wkStats(){const out=[];for(let w=0;w<13;w++){let a=0,b=0;S.plan.filter(x=>x.w==w).forEach(x=>{b+=x.km;const l=S.logs[add(S.p.start,x.d)];if(l&&done(l))a+=+l.km||0});out.push({l:"W"+(w+1),a,b:Math.round(b)})}return out}
function consistency(){const t=today();let pl=0,dn=0;S.plan.forEach(x=>{const d=add(S.p.start,x.d);if(d<=t&&x.type!="rest"){pl++;if(done(S.logs[d]))dn++}});return pl?Math.round(dn/pl*100):null}
function bars(d){const mx=Math.max(1,...d.map(x=>Math.max(x.a,x.b))),W=d.length*28;return`<svg viewBox="0 0 ${W+10} 120" width="100%" role="img" aria-label="Weekly distance, planned and actual">${d.map((x,i)=>`<rect x="${i*28+4}" y="${100-x.b/mx*90}" width="11" height="${x.b/mx*90}" fill="var(--ln)"/><rect x="${i*28+15}" y="${100-x.a/mx*90}" width="11" height="${x.a/mx*90}" fill="var(--ac)"/><text x="${i*28+4}" y="114">${x.l}</text>`).join("")}</svg>`}
function lines(){const ls=Object.keys(S.logs).sort().slice(-14).map(k=>S.logs[k]).filter(l=>l.eff);if(ls.length<2)return`<p class="mu">Log at least two sessions to see effort and fatigue trends.</p>`;const pt=k=>ls.map((l,i)=>(i*(300/(ls.length-1))+5)+","+(105-l[k]*10)).join(" ");return`<svg viewBox="0 0 310 115" width="100%" role="img" aria-label="Effort and fatigue"><polyline points="${pt("eff")}" fill="none" stroke="var(--ac)" stroke-width="2"/><polyline points="${pt("fat")}" fill="none" stroke="var(--bad)" stroke-width="2"/><text x="5" y="113">Green: effort · Orange: fatigue (1–10, last ${ls.length} logs)</text></svg>`}

/* ---------- adaptive ---------- */
function proposals(){const t=today(),out=[],ls=[];for(let i=0;i<7;i++){const l=S.logs[add(t,-i)];if(l)ls.push(l)}
 const missed=ls.filter(l=>l.st=="miss").length,fat=ls.length?ls.reduce((a,l)=>a+(+l.fat||0),0)/ls.length:0,pain=ls.some(l=>l.pain),sl=ls.filter(l=>+l.sl&&+l.sl<=2).length;
 const why=[];if(pain)why.push("You reported pain or discomfort. Please get assessed by a qualified healthcare professional and talk to your coach.");if(fat>=7)why.push("Average fatigue is high ("+fat.toFixed(1)+"/10).");if(missed>=2)why.push(missed+" missed sessions this week.");if(sl>=3)why.push("Several nights of poor sleep.");
 if(!why.length)return{why:[],ch:[]};
 const ch=S.plan.filter(x=>{const d=add(S.p.start,x.d);return d>=t&&d<=add(t,7)&&["threshold","intervals","racepace","hills","fartlek","long"].includes(S.mod[x.d]||x.type)}).map(x=>({d:x.d,to:x.type=="long"?"easy":"easy"}));
 return{why,ch}}

/* ---------- coach ---------- */
function coach(q){q=q.toLowerCase();const p=S.p,td=S.plan.find(x=>add(p.start,x.d)==today()),w=td?build(td):null;
 if(NUT.test(q))return"STRIDR doesn’t give nutrition or hydration guidance. I can help with training, recovery scheduling and sleep routine, and for food questions a qualified professional is the right person to ask.";
 if(PAIN.test(q))return"I can’t diagnose injuries, and you should never run through pain. If something hurts when you run or lingers afterwards, stop the hard sessions, swap to rest or easy cross-training, and see a qualified healthcare professional. Log the pain so your plan can adapt.";
 if(/why.*(workout|session)|purpose|today/.test(q))return w?`Today is ${w.title}. ${w.why} Effort: ${w.effort}.`:"Open the Plan tab to see today’s session and why it matters.";
 if(/feel|effort/.test(q))return w?`Aim for ${w.effort}. ${w.t=="easy"?"If you can’t chat comfortably, slow down.":"Hard but controlled; the last rep should feel like the first."}`:"Easy runs should feel conversational (3–4/10); quality sessions 6–8/10; race days 9–10.";
 if(/miss/.test(q))return"One missed session doesn’t change your fitness. Don’t double up; just resume the plan. Mark it missed in the log and the adaptive check will review the week if misses pile up.";
 if(/pace|pacing|start too fast/.test(q))return"Run the first third slightly controlled, hold steady through the middle, and race the last third. Most runners go out too fast; practise your goal rhythm in race-pace sessions."+(p.goal?` Your goal pace is about ${PU(secs(p.goal)/(+p.ev/1000))}.`:"");
 if(/final|last k|fade|struggle/.test(q))return"Fading late usually points to pacing and specific endurance. Check your race review: did you start too fast? Threshold and race-pace work in phases 2 and 3 are aimed at this.";
 if(/warm/.test(q))return"Race-day warm-up: 10–15 min easy jog, dynamic drills, 4 × 80 m strides, finishing about 10 min before the gun so you stay loose and calm.";
 if(/plateau|stuck|not improving/.test(q))return"Plateaus often come from too little recovery, inconsistent weeks, or no recent race. Check fatigue and sleep in your log, keep easy runs truly easy, and run a time trial to see where you really are.";
 if(/cross|xc|hill/.test(q))return"For cross-country, practise on uneven ground and hills, run by effort not pace, and learn the course start and the first 400 m, where positions are decided.";
 if(/track|road|balance/.test(q))return"Balance by picking one priority race per block. Keep one key session event-specific, and let the other races be training for it rather than peaks.";
 if(/5 ?km|improve|faster|pb/.test(q))return`To improve ${evn[p.ev]||""}, consistency comes first, then one threshold session and one interval or race-pace session per week. ${p.goal?`Your 90-day target is ${p.goal}; progress is never guaranteed, so judge it by the trend.`:""}`;
 return"I can explain today’s session, pacing, warm-ups, missed workouts or plateaus. Talk to your own coach about anything specific to your team sessions. What would you like to know?"}

/* ---------- learn ---------- */
const LEARN=[["Understanding easy runs","Easy runs should feel conversational. They build your aerobic base and let you recover between hard days. Going too fast turns them into medium-hard runs that tire you out."],["Interval sessions","Intervals are hard repeats with recovery. The goal is the same pace on the last rep as the first, not smashing the first one."],["Threshold training","A ‘comfortably hard’ effort you could hold for about an hour. It teaches your body to sustain a strong pace for longer."],["Effort levels 1–10","1–3 very easy, 4 easy, 5–6 steady, 7 comfortably hard, 8 hard, 9–10 race effort. When in doubt, go by feel."],["Warm-ups and cool-downs","Jog, drills, then strides before hard sessions. Finish with an easy jog and gentle mobility."],["Rest and recovery","Fitness improves between sessions. Rest days, sleep routine, and recovery weeks keep you healthy. A missed day is not a failure."],["Race tactics","Start controlled, run the middle with the group, and use the last third to move. Know your plan before the gun."],["Cross-country and road racing","Cross-country is about effort and position; road racing is about even pacing. Practise the surface you will race on."],["Track etiquette","Faster runners pass on the outside, stay out of lane 1 during recovery jogs, and check behind you before moving in."],["Handling pre-race nerves","Nerves mean you care. Stick to your routine, break the race into sections, and focus on the first 400 m."],["Common mistakes","Easy runs too fast, jumping mileage, skipping recovery, copying others’ plans, racing too often."],["Balancing school or university and training","Plan your week around exams and deadlines. Keep easy runs easy in busy weeks, protect your sleep routine, and tell your coach early when workload spikes. A lighter week during exams is a smart decision, not a setback."],["Racing for your school or university team","Team races reward showing up healthy. Learn your coach’s plan for the season, race your own pacing inside a pack, and treat team sessions as part of your week, not extra on top of it."],["Realistic goals","Aim for steady progress over a block. A personal best is a target, not a measure of your worth as an athlete."]];
const QUOTES=["You don’t need a perfect week. You need a sustainable routine you can repeat.","Today’s easy run has a purpose. Learn to execute the right effort, not just the fastest pace.","Your personal best is a target, not a measure of your worth as an athlete.","Train with patience. Performance is built through consistent work over time."];

 $("#nav").innerHTML=S.p?NAV.map(n=>`<button class="${tab==n[0]?"on":""}" onclick="go('${n[0]}')">${n[1]}</button>`).join(""):"";

 if(step==1)h+=`<label>Primary event<select id="ev">${evo(O.ev)}</select></label>${[1,2,3].map(i=>`<label>Secondary event ${i} (optional)<select id="sec${i}"><option value="">None</option>${evo(O["sec"+i])}</select></label>`).join("")}`+F("pb","Current personal best (mm:ss or h:mm:ss, optional)","text","e.g. 17:45")+F("goal","90-day target time (optional)","text","e.g. 17:20")+`<p class="mu">Your target is a goal, not proof of current fitness. Skip any time you don’t know.</p>`;
 if(step==2)h+=F("km","Typical weekly distance (km)","number")+F("long","Longest recent run (km)","number")+Sl("hard","Hard sessions per week",["0","1","2","3+"])+Sl("exp","Running experience",["Less than 6 months","6–12 months","1–2 years","3–5 years","More than 5 years"]);

 h+=`</div>${step?`<button class="g" onclick="back()">Back</button>`:""}<button onclick="nxt()">${step==4?"Build my 90-day plan":"Next"}</button>`;return h}

 if(step==0&&(!O.name||!(+O.age>=13&&+O.age<=25)))msg="Enter your name and an age between 13 and 25. STRIDR is built for high school and university athletes.";
 if(step==1&&((O.pb&&!secs(O.pb))||(O.goal&&!secs(O.goal))))msg="Enter times as mm:ss or h:mm:ss, or leave them blank.";
 if(step==1&&!msg){const s=[O.sec1,O.sec2,O.sec3].filter(Boolean);if(s.includes(O.ev||"5000")||new Set(s).size<s.length)msg="Choose each secondary event once, and different from your primary event."}
 if(step==2&&!(+O.km>=0&&O.km!==undefined&&O.km!==""))msg="Enter your typical weekly distance (0 if you’re just starting).";
 if(step==4){if((O.days||[]).length<3)msg="Pick at least 3 days.";else if((O.team||[]).some(d=>!O.days.includes(d)))msg="Team session days must also be days you can run.";else if(O.raceDate&&diff(today(),O.raceDate)<7)msg="Choose a race at least a week away, or leave it blank.";}
 if(msg){render();return}
 if(step<4){step++;render();return}
 const km=+O.km,p={name:O.name,age:O.age,city:O.city,level:O.level,coach:O.coach,ev:O.ev||"5000",sec:[O.sec1,O.sec2,O.sec3].filter(Boolean),pb:O.pb||"",goal:O.goal||"",km:km||0,long:O.long,inj:O.inj||"No",days:O.days,raceDate:O.raceDate||"",team:O.team||[],teamNote:O.tnote||"",unit:"km",start:today(),startPB:O.pb||""};
 if(p.km<15&&+O.long<8)p.km=Math.max(p.km,6);
 S.p=p;S.plan=gen(p);S.logs={};S.races=[];S.mod={};S.sel=0;save();tab="dash";render()}
const dtl=(it,full)=>{const o=build(it);return`<div class="card"><h3>${o.title} · ${U(o.km)||""}</h3><p class="mu">${add(S.p.start,it.d)} · Day ${it.d+1} · ${o.dur?"~"+o.dur+" min":"Rest"} · Effort: ${o.effort}</p><p><b>Objective:</b> ${o.obj}</p>${o.wu?`<p><b>Warm-up:</b> ${o.wu}</p>`:""}<p><b>Main:</b> ${o.main}</p>${o.rec?`<p><b>Recovery:</b> ${o.rec}</p>`:""}${o.cd?`<p><b>Cool-down:</b> ${o.cd}</p>`:""}${full?`<p><b>Why it matters:</b> ${o.why}</p><p><b>Simpler option:</b> ${o.alt||"Rest."}</p><p class="mu"><b>Safety:</b> ${o.safe}</p><button class="g" onclick="aiEx(${it.d})">Explain this session for me</button><div id="ex" style="white-space:pre-wrap"></div>`:""}</div>`};
const V={rev(){return`<h1>Reviews</h1><p class="mu">Your starting point compared with your recorded results at days 30, 60 and 90.</p>`+[30,60,90].map(revCard).join("")},
dash(){const n=dayN(),it=S.plan.find(x=>x.d==n-1),nx=S.plan.find(x=>x.d>=Math.max(0,n-1)&&x.type!="rest"),c=consistency(),ws=wkStats(),cw=Math.min(12,Math.max(0,Math.floor((n-1)/7))),mo=Object.keys(S.logs).filter(k=>k>=add(today(),-30)&&done(S.logs[k])).reduce((a,k)=>a+(+S.logs[k].km||0),0),lg=Math.max(0,...Object.values(S.logs).filter(done).map(l=>+l.km||0)),ph=n<=30?"Foundation":n<=60?"Development":"Performance",pr=proposals(),rc=S.p.raceDate&&S.p.raceDate>=today()?diff(today(),S.p.raceDate):null;
 let h=`<h1>Welcome, ${esc(S.p.name)}</h1><p class="mu">${n<1?"Starts tomorrow":n>90?"Block complete":ph+" phase · Day "+n+" of 90 · "+(90-n)+" days left"}</p><div class="card"><p class="mu">${QUOTES[n%4]}</p></div>`;
 if(it)h+=`<h2>Today</h2>`+dtl(it,0)+`<button onclick="S.sel=${it.d};go('plan')">Full details</button><button class="g" onclick="go('log')">Log it</button>`;

 if(rc!==null)h+=`<p class="mu">Next race: ${S.p.raceDate} (${rc} days)</p>`;
 if(pr.why.length)h+=`<div class="card warn"><b>Plan check</b><br>${pr.why.join("<br>")}<br><br><button onclick="prevAdapt()">Preview changes</button></div>`;
 h+=`<div class="grid"><div class="card"><div class="mu">This week (recorded)</div><div class="big">${U(ws[cw].a)}</div></div><div class="card"><div class="mu">Last 30 days</div><div class="big">${U(mo)}</div></div><div class="card"><div class="mu">Sessions done</div><div class="big">${Object.values(S.logs).filter(done).length}</div></div><div class="card"><div class="mu">Consistency</div><div class="big">${c===null?"–":c+"%"}</div></div><div class="card"><div class="mu">Longest run</div><div class="big">${U(lg)}</div></div><div class="card"><div class="mu">Target</div><div class="big">${S.p.goal||"–"}</div><div class="mu">${evn[S.p.ev]}</div></div></div>`;

learn(){return`<h1>Learn</h1><div class="card">${LEARN.map(a=>`<details><summary>${a[0]}</summary><p>${a[1]}</p></details>`).join("")}</div>`},
prof(){const p=S.p;return`<h1>Profile</h1><div class="card"><b>Account</b><p class="mu" id="who">${who||"Not signed in"}</p><p class="mu" id="sync">${sync}</p></div><div class="card"><p><b>${esc(p.name)}</b>, ${p.age} · ${esc(p.city)} · ${p.level}</p><p class="mu">Event: ${evn[p.ev]}${(p.sec||[]).length?" (also "+p.sec.map(e=>evn[e]).join(", ")+")":""} · PB: ${p.pb||"–"} · Target: ${p.goal||"–"} · Days: ${p.days.map(d=>DN[d]).join(", ")}${p.raceDate?" · Race: "+p.raceDate:""}</p><label>Units<select onchange="S.p.unit=this.value;save();render()"><option value="km" ${p.unit=="km"?"selected":""}>Kilometres</option><option value="mi" ${p.unit=="mi"?"selected":""}>Miles</option></select></label><button onclick="regen()">Regenerate plan from today</button><button class="g" onclick="exp()">Export my data</button><button class="g" onclick="wipe()">Delete my data</button></div>${teamCard()}${secCard()}<p class="mu">On this version your data is stored only in this browser. Clearing browser data deletes it, so export a backup from time to time. STRIDR gives no medical or nutrition advice; your plan is guidance, not a guarantee.</p>`}};
function report(w){const ws=wkStats()[w],c=consistency(),ls=Object.keys(S.logs).filter(k=>diff(k,today())<7&&diff(k,today())>=0).map(k=>S.logs[k]),mi=ls.filter(l=>l.st=="miss").length,f=ls.length?(ls.reduce((a,l)=>a+(+l.fat||0),0)/ls.length).toFixed(1):null;
 return`<div class="card"><h3>Weekly coaching report</h3><p><b>Went well:</b> ${ls.filter(done).length?ls.filter(done).length+" sessions logged in the last 7 days. "+(c!==null?"Overall consistency "+c+"%.":""):"Nothing logged yet. Your first log starts the picture."}</p><p><b>Needs attention:</b> ${mi?mi+" missed session(s), so we’ll review the week without doubling up. ":""}${f&&f>=7?"Fatigue is high; consider easier training. ":""}${!mi&&!(f&&f>=7)?"No concerns flagged.":""}</p><p><b>Data suggests:</b> ${U(ws.a)} recorded of ${U(ws.b)} planned this week.</p><p><b>Next focus:</b> keep easy runs easy and protect your key session. Tip: sleep and routine are training too.</p><button class="g" onclick="aiNote()">Write my AI coaching note</button><div id="ainote" style="white-space:pre-wrap"></div></div>`}
function saveLog(d){const v=i=>$("#"+i).value;S.logs[d]={st:v("st"),km:v("lk"),min:v("lm"),hr:v("lh"),eff:v("le"),fat:v("lf"),sl:v("ls"),mood:v("lo"),pain:$("#lp").checked,note:v("ln")};save();alert($("#lp").checked?"Saved. You reported pain: please rest from hard sessions and see a qualified healthcare professional.":"Saved.");go("dash")}
function addRace(){const t=$("#rt").value;if(!secs(t)){alert("Enter a time as mm:ss or h:mm:ss.");return}S.races.push({d:$("#rd").value,ev:$("#re").value,t,rp:$("#rp").value,n:$("#rn").value});save();render()}

function prevAdapt(){const pr=proposals();prev=pr;const el=document.createElement("div");el.className="card";el.innerHTML=`<h3>Proposed changes</h3>${pr.ch.length?pr.ch.map(c=>`<p>${add(S.p.start,c.d)}: ${NAMES[S.plan[c.d].type]} → Easy run</p>`).join(""):"<p>No demanding sessions in the next 7 days. Consider a rest day.</p>"}<button onclick="applyAdapt()">Apply changes</button><button class="g" onclick="render()">Cancel</button>`;$("#app").prepend(el);window.scrollTo(0,0)}
function applyAdapt(){prev.ch.forEach(c=>S.mod[c.d]=c.to);save();render()}
function regen(){const keep=S.logs;S.p.start=today();S.plan=gen(S.p);S.mod={};S.logs={};save();alert("New plan from today. Previous logs were cleared; export first next time if you want a copy.");render()}
function exp(){const a=document.createElement("a");a.href="data:application/json,"+encodeURIComponent(JSON.stringify(S));a.download="stridr-data.json";a.click()}
render();boot();
</script></body></html>
